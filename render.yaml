# Deploy backend API to Render (free tier, HTTPS included)
# Dashboard: https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: smartmeter-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
